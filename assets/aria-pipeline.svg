<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">Project Aria multimodal data workflow</title><desc id="desc">A participant performing assembly is recorded using Project Aria and two fixed cameras, producing RGB, Depth and gaze data which are annotated, timestamp mapped and prepared for multimodal modelling.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#122b24"/><stop offset="1" stop-color="#0a1714"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#78988c"/></marker></defs><rect width="760" height="320" rx="28" fill="url(#bg)"/><g font-family="Arial, Helvetica, sans-serif"><text x="34" y="40" fill="#9ab8ac" font-size="13" letter-spacing="1.5">MULTIMODAL DATA PIPELINE</text><text x="34" y="69" fill="#f5faf8" font-size="22" font-weight="700">From human activity to synchronized training data</text><rect x="38" y="119" width="126" height="132" rx="18" fill="#10231d" stroke="#ffffff" stroke-opacity=".10"/><circle cx="101" cy="153" r="20" fill="#60a5fa" opacity=".25" stroke="#60a5fa"/><path d="M73 221 C76 190 84 177 101 177 C118 177 126 190 129 221" fill="#21473c"/><rect x="79" y="145" width="44" height="7" rx="3.5" fill="#34d399"/><text x="65" y="238" fill="#f5faf8" font-size="12" font-weight="700">Participant</text><rect x="207" y="104" width="150" height="164" rx="18" fill="#10231d" stroke="#ffffff" stroke-opacity=".10"/><text x="231" y="132" fill="#9ab8ac" font-size="10">SENSING</text><rect x="231" y="148" width="102" height="35" rx="10" fill="#163b2e"/><text x="250" y="171" fill="#f5faf8" font-size="12">Project Aria</text><rect x="231" y="193" width="102" height="35" rx="10" fill="#183147"/><text x="249" y="216" fill="#f5faf8" font-size="12">Fixed cameras</text><text x="231" y="249" fill="#78988c" font-size="10">controlled recording</text><rect x="401" y="104" width="134" height="164" rx="18" fill="#10231d" stroke="#ffffff" stroke-opacity=".10"/><text x="425" y="132" fill="#9ab8ac" font-size="10">MODALITIES</text><g font-size="12" fill="#f5faf8"><circle cx="429" cy="160" r="5" fill="#34d399"/><text x="443" y="164">RGB</text><circle cx="429" cy="192" r="5" fill="#60a5fa"/><text x="443" y="196">Depth</text><circle cx="429" cy="224" r="5" fill="#e1b866"/><text x="443" y="228">Gaze</text></g><text x="425" y="249" fill="#78988c" font-size="10">prepared for modelling</text><rect x="579" y="104" width="143" height="164" rx="18" fill="#10231d" stroke="#ffffff" stroke-opacity=".10"/><text x="603" y="132" fill="#9ab8ac" font-size="10">PROCESSING</text><text x="603" y="161" fill="#f5faf8" font-size="12">Temporal annotation</text><text x="603" y="188" fill="#f5faf8" font-size="12">Timestamp mapping</text><text x="603" y="215" fill="#f5faf8" font-size="12">Quality checks</text><rect x="603" y="232" width="95" height="24" rx="8" fill="#174434"/><text x="617" y="248" fill="#34d399" font-size="10" font-weight="700">MODEL-READY</text><path d="M164 185 L207 185" stroke="#78988c" stroke-width="2" marker-end="url(#arrow)"/><path d="M357 185 L401 185" stroke="#78988c" stroke-width="2" marker-end="url(#arrow)"/><path d="M535 185 L579 185" stroke="#78988c" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
